# GNSS board journal size/retention cap (H3).
# Drop-in for systemd-journald: installed at
#   /etc/systemd/journald.conf.d/99-gnss.conf
# Bakes into the SD-card golden image, so every flashed board inherits it.
#
# Apply/refresh:  sudo systemctl restart systemd-journald
# Reclaim now:    sudo journalctl --vacuum-size=80M
[Journal]
SystemMaxUse=80M
MaxRetentionSec=7day
